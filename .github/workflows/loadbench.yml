name: LoadBench

# Cross-platform level-loading benchmark for the error handling migration, see ExceptionFreeErrorHandling.md.
# Builds the LoadBench tool in Release, with and without LTO (/GL /LTCG on MSVC), runs it against games.lod, and
# publishes the RESULT lines in the job summary. Compare against local aarch64 numbers in ExceptionFreeErrorHandling.md.

on:
  push:
    branches:
      - feature/exception-free
    paths:
      - '.github/workflows/loadbench.yml'
  workflow_dispatch: null

jobs:
  loadbench:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target:
          - windows_x86
          - windows_x86_64
          - darwin_arm64
          - linux_x86_64
        lto:
          - 'ON'
          - 'OFF'
    runs-on: >-
      ${{
        startsWith(matrix.target, 'windows_') && 'windows-2022' ||
        startsWith(matrix.target, 'darwin_')  && 'macos-15'     ||
        'ubuntu-24.04'
      }}
    defaults:
      run:
        shell: bash
    steps:
      - name: 'Initialize matrix vars'
        run: |
          set -euo pipefail
          target="${{matrix.target}}"
          case "$target" in
            windows_x86)    platform=windows; architecture=x86;    cmake_args="";;
            windows_x86_64) platform=windows; architecture=x86_64; cmake_args="";;
            darwin_arm64)   platform=darwin;  architecture=arm64;  cmake_args="-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11";;
            linux_x86_64)   platform=linux;   architecture=x86_64; cmake_args="-DCMAKE_C_COMPILER=gcc-15 -DCMAKE_CXX_COMPILER=g++-15";;
            *) echo "Unknown target: $target" >&2; exit 1;;
          esac
          echo "MATRIX_PLATFORM=$platform" >> "$GITHUB_ENV"
          echo "MATRIX_ARCHITECTURE=$architecture" >> "$GITHUB_ENV"
          echo "MATRIX_CMAKE_ARGS=$cmake_args" >> "$GITHUB_ENV"

      - name: '[darwin] Set up Xcode'
        if: env.MATRIX_PLATFORM == 'darwin'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 16.3

      - name: 'Checkout'
        uses: actions/checkout@v5.0.0
        with:
          submodules: recursive

      - name: '[linux] Install dependencies'
        if: env.MATRIX_PLATFORM == 'linux'
        uses: Wandalen/wretry.action@master
        with:
          attempt_limit: 3
          attempt_delay: 5000
          command: |
            sudo apt-get update
            sudo apt-get install -y gcc-multilib g++-multilib mold libgmp-dev libmpfr-dev libmpc-dev libisl-dev flex bison
            sudo apt-get install -y libglu1-mesa-dev libdwarf-dev libelf-dev

      # Same gcc-15-from-source setup as build_all.yml, sharing its cache key.
      - name: '[linux] Set GCC_PREFIX'
        if: env.MATRIX_PLATFORM == 'linux'
        run: echo "GCC_PREFIX=$HOME/gcc-15" >> "$GITHUB_ENV"

      - name: '[linux] Restore gcc-15 cache'
        if: env.MATRIX_PLATFORM == 'linux'
        id: gcc-cache
        uses: actions/cache@v4
        with:
          path: ${{env.GCC_PREFIX}}
          key: gcc-15-${{env.ImageOS}}-${{runner.arch}}-${{hashFiles('scripts/build_gcc_15.sh')}}

      - name: '[linux] Build gcc-15'
        if: env.MATRIX_PLATFORM == 'linux' && steps.gcc-cache.outputs.cache-hit != 'true'
        run: bash scripts/build_gcc_15.sh "$GCC_PREFIX"

      - name: '[linux] Add gcc-15 to PATH'
        if: env.MATRIX_PLATFORM == 'linux'
        run: |
          echo "$GCC_PREFIX/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$GCC_PREFIX/lib64:$GCC_PREFIX/lib32${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: '[windows] Setup MSVC environment'
        if: env.MATRIX_PLATFORM == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: '${{env.MATRIX_ARCHITECTURE}}'

      - name: 'Restore data cache'
        id: restore_data_cache
        uses: actions/cache/restore@v4.2.4
        with:
          path: |
            OpenEnroth_GameData
          key: data-cache
          enableCrossOsArchive: ${{env.MATRIX_PLATFORM == 'windows'}}

      # The data cache can restore with bogus contents on some platforms (observed: empty mm7/ on ubuntu-24.04), so
      # check for the actual payload, not just a cache hit.
      - name: 'Check data'
        id: check_data
        run: |
          if [ -f "$GITHUB_WORKSPACE/OpenEnroth_GameData/mm7/data/games.lod" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            rm -rf "$GITHUB_WORKSPACE/OpenEnroth_GameData"
          fi

      # Fallback for when the data cache is cold or broken, mirroring build_data_cache.yml. Requires the
      # DATA_ACCESS_TOKEN secret; does nothing on runs that don't have access to secrets.
      - name: 'Checkout private data'
        if: steps.check_data.outputs.ok != 'true' && env.SECRETS_DATA_TOKEN != ''
        continue-on-error: true # A stale token shouldn't kill the leg - it just skips the benchmark.
        uses: actions/checkout@v5.0.0
        with:
          repository: OpenEnroth/OpenEnroth_GameData
          path: OpenEnroth_GameData
          lfs: 'true'
          token: '${{secrets.DATA_ACCESS_TOKEN}}'
        env:
          SECRETS_DATA_TOKEN: '${{secrets.DATA_ACCESS_TOKEN}}'

      # Answers "how expensive is thread_local on Apple arm64, and does AppleClang CSE repeated accesses" - see the
      # frame arena in Result.h. Results go to the job summary.
      - name: '[darwin] TLV codegen probe'
        if: env.MATRIX_PLATFORM == 'darwin'
        run: |
          cat > /tmp/tlv_probe.cpp <<'PROBE'
          #include <cstddef>
          struct Arena { char buf[65536]; unsigned long top = 0; };
          constinit thread_local Arena arena;

          // Three accesses in one function - one _tlv_get_addr call, or three?
          __attribute__((noinline)) unsigned long threeAccesses() {
              arena.top += 1;
              arena.buf[arena.top] = 2;
              arena.top += 3;
              return arena.top;
          }

          // An allocate/deallocate pair, like a coroutine frame lifecycle - one call in each function.
          __attribute__((noinline)) void *arenaAlloc(std::size_t n) { void *r = arena.buf + arena.top; arena.top += n; return r; }
          __attribute__((noinline)) void arenaFree(std::size_t n) { arena.top -= n; }

          int main() { arenaAlloc(64); arenaFree(64); return threeAccesses() != 0; }
          PROBE
          clang++ -std=c++20 -O2 -c /tmp/tlv_probe.cpp -o /tmp/tlv_probe.o
          {
            echo "### TLV codegen probe, darwin_arm64 (_tlv_get_addr calls per function)"
            echo '```'
            otool -tv /tmp/tlv_probe.o | awk '/^_.*:$/ { if (fn != "") print calls, fn; fn = $1; calls = 0 } /tlv_get_addr/ { calls++ } END { if (fn != "") print calls, fn }'
            echo ""
            echo "=== full disassembly of threeAccesses:"
            otool -tv /tmp/tlv_probe.o | sed -n '/threeAccesses/,/^_arenaAlloc/p'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 'Configure'
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=${{matrix.lto}} -DOE_BUILD_TESTS=OFF ${{env.MATRIX_CMAKE_ARGS}}

      - name: 'Build'
        working-directory: build
        run: |
          ninja LoadBench

      - name: 'Run LoadBench'
        run: |
          set -euo pipefail
          exe=build/src/Bin/LoadBench/LoadBench
          if [ -f "$exe.exe" ]; then
            exe="$exe.exe"
          fi

          lod="$GITHUB_WORKSPACE/OpenEnroth_GameData/mm7/data/games.lod"
          if [ ! -f "$lod" ]; then
            echo "::warning::games.lod unavailable on this leg - benchmark skipped, but the build was validated."
            echo "### LoadBench ${{matrix.target}} lto=${{matrix.lto}}: SKIPPED, no game data" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "### LoadBench ${{matrix.target}} lto=${{matrix.lto}}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for run in 1 2 3; do
            out=$("$exe" "$lod" 15)
            echo "$out"
            echo "$out" | grep RESULT >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
