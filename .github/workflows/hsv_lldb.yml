name: HsvColorf flag probe

# Throwaway probe. The HsvColorf NaN comes from a ucomiss on equal values whose jne/jnp pair takes the "not equal"
# path. flagtest sets x86 flags with known outcomes and reads them back, on macos-15 (Rosetta) and macos-15-intel.

on:
  push:
    branches:
      - probe/hsv-lldb
  workflow_dispatch:

jobs:
  flags:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, shard: 1 }
          - { runner: macos-15, shard: 2 }
          - { runner: macos-15-intel, shard: 1 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Build
        run: |
          clang -O2 -g -arch x86_64 -mmacosx-version-min=10.15 -pthread .github/hsv-probe/flagtest.c -o flagtest
          file flagtest
          sysctl -n machdep.cpu.brand_string hw.ncpu
          xcrun objdump -d --no-show-raw-insn --x86-asm-syntax=intel flagtest | grep -B2 -A8 "ucomiss" | head -60

      - name: Flags
        run: |
          for cfg in "oe 4 300" "eq0 4 300" "eq8 4 300" "eq64 4 300" "lt64 4 300" "int64 4 300" "eq64 1 300" "eq64 12 300"; do
            ./flagtest $cfg || true
          done
